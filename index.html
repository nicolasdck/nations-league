<!doctype html>
<html lang="fr">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="preload" as="image" href="/pwa-192x192.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#020617" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Nations League" />
		<meta name="description" content="Ligue des Nations UEFA 2026-27 : calendrier, scores en direct, classements, projections et alertes de buts." />
		<title>Nations League 2026-27</title>
		<style>
			#app-loader {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #020617;
				z-index: 9999;
			}
			#app-loader img {
				width: 72px;
				height: 72px;
				border-radius: 16px;
				animation: app-loader-pulse 1s ease-in-out infinite alternate;
			}
			@keyframes app-loader-pulse {
				to {
					transform: scale(0.88);
					opacity: 0.7;
				}
			}
		</style>
	</head>
	<body>
		<div id="app-loader">
			<img src="/pwa-192x192.png" alt="Chargement…" />
		</div>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
